version: '3.8'

services:
  # Monitored Host Backend Agent
  agent:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: server-monitor-agent
    restart: unless-stopped
    network_mode: host
    pid: host
    environment:
      - HTTP_ADDR=:8080
      - SERVER_ID=docker-node-01
      - METRICS_INTERVAL=1s
      - HISTORY_SIZE=60
      - LOG_LEVEL=info
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Central Nginx Reverse Proxy + Static Frontend Host
  nginx:
    image: nginx:alpine
    container_name: server-monitor-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/var/www/server-monitor/dist:ro
    depends_on:
      - agent
